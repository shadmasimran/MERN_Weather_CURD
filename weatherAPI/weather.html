<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12141A;
    --dusk:#16213A;
    --dusk-deep:#0D1526;
    --parchment:#F4EDE1;
    --amber:#E8935A;
    --cyan:#7FB8C4;
    --line: rgba(244,237,225,0.18);
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at top, #1E2D4D 0%, var(--dusk) 45%, var(--dusk-deep) 100%);
    font-family:'Inter', sans-serif;
    color:var(--parchment);
    display:flex;
    justify-content:center;
    padding:64px 24px;
  }

  .page{
    width:100%;
    max-width:560px;
  }

  .masthead{
    text-align:center;
    margin-bottom:40px;
  }

  .masthead h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:2rem;
    letter-spacing:0.01em;
    margin:0 0 6px;
  }

  .masthead p{
    margin:0;
    font-size:0.9rem;
    color:var(--cyan);
  }

  form.search{
    display:flex;
    gap:10px;
    margin-bottom:48px;
  }

  .search input[type="text"]{
    flex:1;
    background:transparent;
    border:1px solid var(--line);
    border-radius:2px;
    padding:14px 16px;
    font-family:'Inter', sans-serif;
    font-size:1rem;
    color:var(--parchment);
    outline:none;
    transition:border-color 0.2s ease;
  }

  .search input[type="text"]::placeholder{
    color:rgba(244,237,225,0.45);
  }

  .search input[type="text"]:focus{
    border-color:var(--amber);
  }

  .search button{
    background:var(--amber);
    color:var(--dusk-deep);
    border:none;
    border-radius:2px;
    padding:14px 24px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:0.95rem;
    cursor:pointer;
    transition:transform 0.15s ease, background 0.2s ease;
  }

  .search button:hover{
    background:#F0A66E;
  }

  .search button:active{
    transform:scale(0.97);
  }

  /* status states */
  .status{
    text-align:center;
    padding:40px 0;
    color:rgba(244,237,225,0.6);
    font-size:0.95rem;
  }

  .status.error{
    color:#E8935A;
  }

  /* report card */
  .report{
    display:none;
  }

  .report.visible{
    display:block;
    animation: rise 0.45s ease;
  }

  @keyframes rise{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }

  .report .city-line{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:1px solid var(--line);
    padding-bottom:14px;
    margin-bottom:28px;
  }

  .report .city-line h2{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:1.5rem;
    margin:0;
  }

  .report .city-line span{
    font-size:0.85rem;
    color:var(--cyan);
  }

  .headline{
    display:flex;
    align-items:flex-end;
    gap:20px;
    margin-bottom:36px;
  }

  .headline .temp{
    font-family:'Fraunces', serif;
    font-weight:400;
    font-size:5.5rem;
    line-height:0.9;
  }

  .headline .temp sup{
    font-size:2rem;
    
    font-weight:400;
    vertical-align:super;
  }

  .headline .condition{
    padding-bottom:10px;
  }

  .headline .condition .desc{
    font-size:1.15rem;
    margin-bottom:4px;
  }

  .headline .condition .feels{
    font-size:0.85rem;
    color:rgba(244,237,225,0.55);
  }

  .strip{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    border-top:1px solid var(--line);
    padding-top:20px;
  }

  .strip .item{
    text-align:left;
    padding-right:8px;
  }

  .strip .item .label{
    font-size:0.7rem;
    color:rgba(244,237,225,0.5);
    margin-bottom:6px;
  }

  .strip .item .value{
    font-family:'Fraunces', serif;
    font-size:1.15rem;
  }

  @media (max-width: 480px){
    .strip{grid-template-columns:repeat(2, 1fr); row-gap:20px;}
    .headline .temp{font-size:4rem;}
  }
</style>
</head>
<body>

<div class="page">
  <div class="masthead">
    <h1>Weather Report</h1>
    <p>Search any city for current conditions</p>
  </div>

  <form class="search" id="searchForm">
    <input type="text" id="cityInput" placeholder="Enter a city name…" autocomplete="off">
    <button type="submit">Search</button>
  </form>

  <div id="status" class="status"></div>

  <div class="report" id="report">
    <div class="city-line">
      <h2 id="cityName">—</h2>
      <span id="updatedAt">—</span>
    </div>

    <div class="headline">
      <div class="temp" id="temp">—</div>
      <div class="condition">
        <div class="desc" id="conditionDesc">—</div>
        <div class="feels" id="feelsLike">—</div>
      </div>
    </div>

    <div class="strip">
      <div class="item">
        <div class="label">Wind</div>
        <div class="value" id="wind">—</div>
      </div>
      <div class="item">
        <div class="label">Humidity</div>
        <div class="value" id="humidity">—</div>
      </div>
      <div class="item">
        <div class="label">Pressure</div>
        <div class="value" id="pressure">—</div>
      </div>
      <div class="item">
        <div class="label">Cloud Cover</div>
        <div class="value" id="cloud">—</div>
      </div>
    </div>
  </div>
</div>

<script>
  const form = document.getElementById('searchForm');
  const input = document.getElementById('cityInput');
  const statusEl = document.getElementById('status');
  const report = document.getElementById('report');

  // WMO weather codes -> human description
  const WMO_CODES = {
    0: "Clear sky", 1: "Mostly clear", 2: "Partly cloudy", 3: "Overcast",
    45: "Fog", 48: "Depositing rime fog",
    51: "Light drizzle", 53: "Moderate drizzle", 55: "Dense drizzle",
    56: "Light freezing drizzle", 57: "Dense freezing drizzle",
    61: "Slight rain", 63: "Moderate rain", 65: "Heavy rain",
    66: "Light freezing rain", 67: "Heavy freezing rain",
    71: "Slight snow", 73: "Moderate snow", 75: "Heavy snow", 77: "Snow grains",
    80: "Slight rain showers", 81: "Moderate rain showers", 82: "Violent rain showers",
    85: "Slight snow showers", 86: "Heavy snow showers",
    95: "Thunderstorm", 96: "Thunderstorm with hail", 99: "Thunderstorm with heavy hail"
  };

  function setStatus(message, isError = false){
    statusEl.textContent = message;
    statusEl.className = 'status' + (isError ? ' error' : '');
    statusEl.style.display = message ? 'block' : 'none';
  }

  function showReport(){
    report.classList.add('visible');
  }

  function hideReport(){
    report.classList.remove('visible');
  }

  async function geocodeCity(city){
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('Geocoding request failed');
    const data = await res.json();
    if(!data.results || data.results.length === 0){
      throw new Error(`No location found for "${city}"`);
    }
    return data.results[0];
  }

  async function fetchWeather(lat, lon){
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,surface_pressure,cloud_cover&timezone=auto`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('Weather request failed');
    const data = await res.json();
    if(!data.current) throw new Error('No current weather data available');
    return data.current;
  }

  function renderWeather(place, current){
    const cityLabel = [place.name, place.admin1, place.country]
      .filter(Boolean)
      .filter((v, i, arr) => arr.indexOf(v) === i)
      .join(', ');

    document.getElementById('cityName').textContent = cityLabel;

    const now = new Date();
    document.getElementById('updatedAt').textContent =
      'Updated ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    document.getElementById('temp').innerHTML =
      `${Math.round(current.temperature_2m)}<sup>°C</sup>`;

    const desc = WMO_CODES[current.weather_code] ?? 'Conditions unavailable';
    document.getElementById('conditionDesc').textContent = desc;
    document.getElementById('feelsLike').textContent =
      `Feels like ${Math.round(current.apparent_temperature)}°C`;

    document.getElementById('wind').textContent = `${Math.round(current.wind_speed_10m)} km/h`;
    document.getElementById('humidity').textContent = `${Math.round(current.relative_humidity_2m)}%`;
    document.getElementById('pressure').textContent = `${Math.round(current.surface_pressure)} hPa`;
    document.getElementById('cloud').textContent = `${Math.round(current.cloud_cover)}%`;

    showReport();
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const city = input.value.trim();
    if(!city){
      setStatus('Enter a city name to search.', true);
      hideReport();
      return;
    }

    hideReport();
    setStatus('Searching…');

    try{
      const place = await geocodeCity(city);
      const current = await fetchWeather(place.latitude, place.longitude);
      setStatus('');
      renderWeather(place, current);
    }catch(err){
      setStatus(err.message || 'Something went wrong. Try another city.', true);
    }
  });
</script>

</body>
</html>
